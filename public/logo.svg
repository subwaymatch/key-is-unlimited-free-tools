<svg xmlns="http://www.w3.org/2000/svg" viewBox="-98.15 -53.15 196.29 196.29">
<!--
  The key.is mark: three rounded plates, each smaller than the one below,
  stacked in isometric projection.

  Everything is authored in ground coordinates inside one matrix transform.
  A plate is its top outline in the light tone, plus a side made by sweeping
  the visible run of that outline along the diagonal (t, t), which is what
  "straight down by t" looks like once projected. Light comes from the top
  left: tops are #5EC2FF, faces that look left #2F8EE0, faces that look
  right #1C5FB8. No outlines, no gradients, arcs stay arcs.
-->
