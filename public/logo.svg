<!-- key.is: three keys on a split ring, drawn flat in one plane and
     projected isometrically. A ground circle projects to an axis-aligned
     ellipse with rx = R*sqrt(3/2), ry = R/sqrt(2), which is why every
     round part here is one arc rather than a polygon. Each shape is drawn
     twice: dropped and dark for the extrusion, then on top in the face
     colour. Keys #55C1FB over #0E79CC, ring #9EA3A8 over #4A4F55. -->
