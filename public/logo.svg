<!-- key.is: three keys on a split ring, seen face-on from slightly above.
     Every coordinate was measured off the chosen render on a grid, in its
     512 px space. Depth is a short extrusion: a blade's edges become side
     quads, a bow's rim is the crescent between the bow and its dropped
     copy, and the ring, a standing washer, shows its outer wall at the
     bottom right and the floor of its inner wall along the bottom of the
     hole. The ring threads the outer keys: drawn again after them, clipped
     to the upper half of each bow, so it passes in front at the top and
     behind at the bottom. Keys #55C1FB, sides #1E86D6, undersides #0E79CC;
     ring #9EA3A8 over #4A4F55. -->
